plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.0'
    id 'xyz.jpenilla.run-paper' version '2.3.1'
}

group = 'dev.jackwith'
version = '1.0-dev'

def targetJavaVersion = 21

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
}

repositories {
    mavenCentral()

    // Paper
    maven { url 'https://repo.papermc.io/repository/maven-public/' }

    // ACF
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
    maven { url = "https://hub.spigotmc.org/nexus/content/groups/public/" }

    // [ DEPENDENCYS ]
    maven { url 'https://mvn.lumine.io/repository/maven-public/' }
    maven { url 'https://repo.rosewooddev.io/repository/public/' }
    maven { url 'https://repo.codemc.org/repository/maven-public/' }

    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
}

dependencies {
    // Paper API
    compileOnly "io.papermc.paper:paper-api:1.21.10-R0.1-SNAPSHOT"

    // [ IMPLEMENTATIONS ]
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
//    implementation 'org.reflections:reflections:0.10.2'

    // [ DEPENDENCYS ]
    compileOnly "com.ticxo.modelengine:ModelEngine:R4.0.9"
    compileOnly('org.black_ixx:playerpoints:3.3.3')
    compileOnly('world.bentobox:bentobox:2.7.0-SNAPSHOT')
    compileOnly('me.clip:placeholderapi:2.12.2')

    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    compileOnly('com.github.brcdev-minecraft:shopgui-api:3.2.0') {
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }

}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']

    if (JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.processResources {
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

tasks.shadowJar {
    relocate 'co.aikar.commands', 'dev.jackwith.acf'
    relocate 'co.aikar.locales', 'dev.jackwith.locales'

//    relocate 'org.reflections', 'dev.jackwith.libs.reflections'
}

build.dependsOn tasks.shadowJar

tasks.runServer {
    minecraftVersion("1.21.11")
}